<style>

 // light or dark: follows the device until the visitor presses the button, then remembers the choice
 const dark=()=>{const d=R.dataset.theme==='dark'||(!R.dataset.theme&&mq.matches);R.classList.toggle('sysdark',d);B.textContent=d?'☀':'☾'};

 about:(nT,nM,nP,d,y0,y1)=>`<h1>How the rating works</h1>
  <p>The rating uses the same scale as FargoRate. A 100 point difference means the higher rated player is expected to win twice as many racks as he loses; 200 points means 4 to 1.</p>
  <h2>What is counted</h2>
  <ul>
   <li>${nT} tournaments with Estonian players from ${y0} to ${y1}, ${num(nM)} of their matches: every tournament in Estonia on CueScore (leagues, Estonian championships, club events), tournaments in Latvia, Lithuania and the Nordic countries, Tournament Service, EPBF (Euro Tour, European Championships), Matchroom and the Predator Pro Billiard Series.</li>
   <li>8-ball, 9-ball and 10-ball singles, played to at least 3 racks. If only the later stages of a tournament (for example semifinals and final) were played to 3 or more, those matches count.</li>
   <li>Straight pool (14.1) singles too, played to 50 points or more: every 14 points count as one rack, so a 70:56 win counts like 5:4. Results still show the real score.</li>
   <li>Matches against foreign players count too. Estonian, Latvian and Lithuanian players are rated together in one Baltic calculation, and other foreign players in the background from all matches of these events, so everyone gets a fair rating. The ranking shows only the ${nP} Estonian players.</li>
   <li>A score one rack short of the race is taken as a typing slip and counted as the full race: 3:0 in a race to 4 counts as 4:0, 4:1 in a race to 5 as 5:1. The race is what the other matches of the same round were played to.</li>
  </ul>
  <h2>What is left out</h2>
  <ul>
   <li>Handicap tournaments (also weekly events known to be played with handicap, even if not marked), doubles and team events, mixed 8/9/10 events, bank pool and one pocket.</li>
   <li>Events whose results show a handicap or fixed-rack format: in many rounds the winners stop at different numbers, or many matches end in a draw.</li>
   <li>Walkovers and unplayed matches, also a walkover written as a score: 3:0 in a race to 5 or longer.</li>
   <li>Test and money games.</li>
   <li>A tournament entered on two sites is counted once.</li>
  </ul>
  <p>Players with more than one profile, on any site, are merged into one.</p>
  <h2>How the rating is calculated</h2>
  <p>Every rack is a small win or loss. The rating is the number that best explains all of a player's racks against all opponents at the same time. Recent results matter more: a match loses half its weight every 2 years. Players who stop playing keep their last rating. Like FargoRate, a rating based on fewer than 200 racks is provisional and is marked with <sup>?</sup>. The level of the scale is set by more than 500 reference players from all over Europe with an established FargoRate (at least 1,000 games there and 300 racks here in the last 2 years): the whole list is placed so that their ratings match their FargoRate on average. A player who differs from his FargoRate does so because of his own results here, not because of the scale.</p>
  <h2>On the site</h2>
  <ul>
   <li><b>Ranking:</b> "Played within" shows players with at least one counted match in that period; "Racks played" counts all their racks. From 200 racks a rating is considered established, the same standard as FargoRate. League = the Estonian Billiard Association classification (Meistriliiga, Esiliiga, Teine liiga; everyone else Rahvaliiga). Club = the Estonian club the player represented in his latest event on CueScore.</li>
   <li><b>Player page:</b> rating history (the rating at the end of every month, from the results known at that time), all results with filters, and head to head against any opponent. Best and worst match and tournament: last 5 years.</li>
   <li><b>Stats:</b> upsets and players of the month, rising stars and the most active players, the most frequent rivalries (races to 5 or longer) and the hill-hill masters (best in the deciding rack).</li>
   <li><b>Tournaments:</b> every counted tournament with Estonian players, with each player's performance in it.</li>
  </ul>
  <p>New results are added automatically every day.</p>
  <h2>Corrections and support</h2>
  <p>Found a wrong merge, a missing tournament or another mistake? Write to <a href="mailto:ahorsun@gmail.com">ahorsun@gmail.com</a></p>

/* texts changed in the admin panel (texts.json, only the changed ones; Aleksandrs 23 Nov 2026). Written as simple markdown:

const TX_ARGS={about:['tournaments','matches','players','updated','from_year','to_year']}, TX_FMT={about:{matches:n=>num(n)}};
const txArgs=(k,f)=>TX_ARGS[k]||((f.toString().match(/^\(?([^)=]*?)\)?\s*=>/)||[,''])[1].split(',').map(x=>x.trim()).filter(Boolean));
function mdInline(x){return x.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>`<a href="${u}"${/^https?:/.test(u)?' target="_blank" rel="noopener"':''}>${a}</a>`)}
function mdToHtml(x){
  if(!/\n|^#|^- /.test(x)) return mdInline(x);
  return x.replace(/\r/g,'').split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return '';
    if(b.startsWith('<'))return b;
    const m=b.match(/^(#{1,3}) (.*)$/s); if(m) return `<h${m[1].length}>${mdInline(m[2].trim())}</h${m[1].length}>`;
    const L=b.split('\n'); if(L.every(l=>/^- /.test(l.trim()))) return '<ul>'+L.map(l=>`<li>${mdInline(l.trim().slice(2))}</li>`).join('')+'</ul>';
    return `<p>${mdInline(L.join(' '))}</p>`}).join('\n');
}
function applyTexts(ov){
  for(const [lang,o] of Object.entries(ov||{})) for(const [k,v] of Object.entries(o||{})){
    if(!TXT[lang]||typeof v!=='string')continue; const def=TXT[lang][k];
    if(typeof def==='function'){const names=txArgs(k,def),f=TX_FMT[k]||{};
      TXT[lang][k]=(...a)=>mdToHtml(v).replace(/\{(\w+)\}/g,(m,n)=>{const i=names.indexOf(n);return i<0?m:(f[n]?f[n](a[i]):a[i])})}
    else TXT[lang][k]=mdToHtml(v);
  }
}

  let m;

  if((m=h.match(/^t(\d+)$/))&&TO[m[1]]) return tournament(+m[1]);

function oppStats(id){
  const st={}, act5=yearsAgo(5);
  (PM[id]||[]).forEach(m=>{const me=m[2]===id, o=me?m[3]:m[2]; if(!PL[o]||!PL[o].lv||isoToNum(PL[o].last_played)<act5||TO[m[1]].game==='14.1') return;
    const s=String(m[0]), mi=D.months.indexOf(s.slice(0,4)+'-'+s.slice(4,6))-1;
    const ra=(mi>=0?histIdx(id,mi):null)??PL[id].rs, rb=(mi>=0?histIdx(o,mi):null)??PL[o].rs;
    const w=me?m[4]:m[5], l=me?m[5]:m[4], x=st[o]||(st[o]={o,n:0,w:0,rw:0,rl:0,e:0});
    x.n++; if(w>l)x.w++; x.rw+=w; x.rl+=l; x.e+=(w+l)/(1+Math.pow(2,(rb-ra)/100));});
  const L=Object.values(st).filter(x=>x.n>=5).map(x=>({...x,d:Math.round(x.rw-x.e)}));
  const bad=L.filter(x=>x.w*2<=x.n&&x.d<0).sort((a,b)=>a.d-b.d)[0], good=L.filter(x=>x.w*2>x.n&&x.d>0).sort((a,b)=>b.d-a.d)[0];
  const mc={}; (PM[id]||[]).forEach(m=>{const me=m[2]===id, o=me?m[3]:m[2]; if(!PL[o]||TO[m[1]].game==='14.1') return; const x=mc[o]||(mc[o]={o,n:0,w:0,rw:0,rl:0,last:0});
    const w=me?m[4]:m[5], l=me?m[5]:m[4]; x.n++; if(w>l)x.w++; x.rw+=w;x.rl+=l; x.last=Math.max(x.last,m[0]);});
  const most=Object.values(mc).filter(x=>x.n>=3).sort((a,b)=>b.n-a.n||b.last-a.last)[0];
  return {bad,good,most};
}

function raceWin(p,n,mx){let s=0,c=1;for(let k=0;k<=Math.min(n-1,mx??n);k++){if(k>0)c=c*(n-1+k)/k;s+=c*Math.pow(p,n)*Math.pow(1-p,k)}return s}

function upsets(days){

  const rk={}; for(const m of D.matches){ if(m[0]>cut) continue; if(m[0]<=cut-20000) break; if(TO[m[1]].game==='14.1') continue; rk[m[2]]=(rk[m[2]]||0)+m[4]+m[5]; rk[m[3]]=(rk[m[3]]||0)+m[4]+m[5] }   // racks in the 2 years before the period
  for(const m of D.matches){ if(m[0]<=cut) break;   // matches are sorted newest first
    const [d,tid,a,b,sa,sb]=m; if(sa===sb||(TO[tid].game==='14.1'?Math.max(m[7],m[8])<75:Math.max(sa,sb)<4)||UPSET_SKIP.has(`${d}:${tid}:${a}:${b}`)) continue;   // races to 4+, 14.1 to 75+
    const [w,l,sw,sl,dsw,dsl]=sa>sb?[a,b,sa,sb,m[7],m[8]]:[b,a,sb,sa,m[8],m[7]];
    if(!((PL[w]&&PL[w].lv)||(PL[l]&&PL[l].lv))) continue;
    if((rk[w]||0)<200||(rk[l]||0)<200) continue;   // both players established
    const s=String(d), mi=D.months.indexOf(s.slice(0,4)+'-'+s.slice(4,6))-1; if(mi<0) continue;

  for(const m of D.matches){ if(m[0]<=cut) break; const st=TO[m[1]].game==='14.1';
    const [d,tid,a,b,sa,sb]=m, s=String(d), mi=D.months.indexOf(s.slice(0,4)+'-'+s.slice(4,6))-1; if(mi<0) continue;
    [[a,b,sa,sb],[b,a,sb,sa]].forEach(([p,o,w,l])=>{ if(!PL[p]||!PL[p].lv||(rk[p]||0)<200) return; const ro=histIdx(o,mi); if(ro==null) return;

}
function formPage(){
  $('#app').innerHTML=`<h1>${t('formTitle')}</h1><p class="lede">${t('formNote')}</p>
  <div class="mv" id="mv0"></div>
  <div class="mv" id="mv" style="margin-top:12px"></div>
  <div class="mv" id="mv2" style="margin-top:12px"></div>`;
  drawUpsets();
  drawAllTime();
  drawForm();
}
const FMIN=100;   // Rising stars and Most active: players with at least 100 matches in total
function drawForm(){
  const chips=(key)=>`<div class="chips" style="margin:2px 12px 8px">${[['3',t('p3')],['6',t('p6')],['12',t('p12')]].map(([k,l])=>`<button class="chip${FS[key]===k?' on':''}" data-f="${key}" data-v="${k}">${l}</button>`).join('')}</div>`;
  const mr=+FS.rise, cr=yearsAgo(mr/12), ma=+FS.act, ca=yearsAgo(ma/12);
  const up=Object.values(PL).filter(p=>p.lv&&isoToNum(p.last_played)>=cr&&(PM[p.id]||[]).reduce((s,m)=>m[0]<cr&&TO[m[1]].game!=='14.1'?s+m[4]+m[5]:s,0)>=200).map(p=>{const h=histAt(p.id,mr);return h?{p,d:p.r-h,h}:null}).filter(x=>x&&x.d>0).sort((a,b)=>b.d-a.d).slice(0,10);
  const list=up.length?`<table><thead><tr><th class="num">#</th><th>${t('thPlayer')}</th><th class="num">${t('thRating')}</th><th class="num">+/−</th></tr></thead><tbody>${up.map((x,i)=>`<tr><td class="num rank">${i+1}</td><td>${plink(x.p.id)}</td><td class="num muted">${x.h} → ${x.p.r}</td><td class="num up">+${x.d}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">–</div>';
  const act=Object.values(PL).filter(p=>p.lv&&p.racks>=200).map(p=>{const ms=(PM[p.id]||[]).filter(m=>m[0]>=ca);return {p,k:ms.length,r:ms.reduce((s,m)=>TO[m[1]].game==='14.1'?s:s+m[4]+m[5],0)}   /* matches include 14.1, racks do not */}).filter(x=>x.k>0).sort((a,b)=>b.r-a.r||b.k-a.k).slice(0,10);
  const alist=act.length?`<table><thead><tr><th class="num">#</th><th>${t('thPlayer')}</th><th class="num">${t('thRacks')}</th><th class="num">${t('thMatches')}</th></tr></thead><tbody>${act.map((x,i)=>`<tr><td class="num rank">${i+1}</td><td>${plink(x.p.id)}</td><td class="num">${num(Math.round(x.r))}</td><td class="num muted">${x.k}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">–</div>';
  const note=`<p class="note" style="margin:8px 12px 12px">${t('min100')}</p>`;
  $('#mv').innerHTML=`<div class="tablebox"><h3>${t('rising')}</h3>${chips('rise')}${list}${note}</div><div class="tablebox"><h3>${t('mostActive')}</h3>${chips('act')}${alist}</div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{FS[b.dataset.f]=b.dataset.v;drawForm()});
}
let ATC=null; const HS={per:'all',r:3};   // hill-hill: deciding racks in races to 3 or longer (decided 23 Oct 2026)
function drawAllTime(){
  if(!ATC){
    const pr={}, hh={};
    D.matches.forEach(m=>{const a=m[2],b=m[3];if(!PL[a]||!PL[b])return;
      const st=TO[m[1]].game==='14.1';
      if(PL[a].lv&&PL[b].lv&&!st&&Math.max(m[4],m[5])>=5){   // rivalries: races to 5 or longer (Aleksandrs 23 Nov 2026)
        const k=a<b?a+'_'+b:b+'_'+a,x=pr[k]||(pr[k]={a:Math.min(a,b),b:Math.max(a,b),n:0,wa:0,ra:0,rb:0});
        x.n++; const aw=m[4]>m[5]; if((a===x.a)===aw)x.wa++; if(!st){x.ra+=a===x.a?m[4]:m[5]; x.rb+=a===x.a?m[5]:m[4];}}   // 14.1: match result counts, racks do not
      if(TO[m[1]].game!=='14.1'&&Math.abs(m[4]-m[5])===1&&Math.max(m[4],m[5])>=3){[[a,m[4]>m[5]],[b,m[5]>m[4]]].forEach(([p,w])=>{if(!PL[p].lv)return;(hh[p]=hh[p]||[]).push([m[0],w,Math.max(m[4],m[5])])})}});
    const riv=Object.values(pr).sort((p,q)=>q.n-p.n).slice(0,10).map(x=>{const aFirst=x.wa>x.n-x.wa||(x.wa===x.n-x.wa&&x.ra>=x.rb);
      return aFirst?{w:x.a,l:x.b,n:x.n,sw:x.wa,sl:x.n-x.wa,rw:x.ra,rl:x.rb}:{w:x.b,l:x.a,n:x.n,sw:x.n-x.wa,sl:x.wa,rw:x.rb,rl:x.ra}});
    ATC={riv,hh};
  }
  const per=HS.per, cut=per==='5'?yearsAgo(5):per==='2'?yearsAgo(2):0, minN=per==='5'?25:per==='2'?15:30;
  const hill=Object.entries(ATC.hh).map(([p,l])=>{const x=l.filter(e=>e[0]>=cut&&e[2]>=HS.r);return {p:+p,n:x.length,w:x.filter(e=>e[1]).length}}).filter(y=>y.n>=minN).map(y=>({...y,pc:y.w/y.n})).sort((p,q)=>q.pc-p.pc||q.n-p.n).slice(0,10);
  const sl=id=>`<a class="pname" href="#p${id}">${esc(pname(id))}</a>`;
  const rt=`<table><thead><tr><th class="num">#</th><th>${t('thRivals')}</th><th class="num">${t('thMatches')}</th><th class="num">${t('thScore2')}</th><th class="num hide-s">${t('thRacks')}</th></tr></thead><tbody>${ATC.riv.map((x,i)=>`<tr><td class="num rank">${i+1}</td><td>${sl(x.w)} – ${sl(x.l)}</td><td class="num">${x.n}</td><td class="num">${x.sw}–${x.sl}</td><td class="num muted hide-s">${Math.round(x.rw)}–${Math.round(x.rl)}</td></tr>`).join('')}</tbody></table>`;
  const ht=`<table><thead><tr><th class="num">#</th><th>${t('thPlayer')}</th><th class="num">${t('thDec')}</th><th class="num">%</th></tr></thead><tbody>${hill.map((x,i)=>`<tr><td class="num rank">${i+1}</td><td>${plink(x.p)}</td><td class="num muted">${x.w}/${x.n}</td><td class="num">${(x.pc*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table><p class="note" style="margin:8px 12px 12px">${t('hillNote',minN)}</p>`;
  const chips=`<div class="chips" style="margin:2px 12px 8px">${[['all',t('hAll')],['5',t('h5')],['2',t('h2')]].map(([k,l])=>`<button class="chip${per===k?' on':''}" data-h="${k}">${l}</button>`).join('')}</div>`;
  $('#mv2').innerHTML=`<div class="tablebox"><h3>${t('rivals')}</h3>${rt}<p class="note" style="margin:8px 12px 12px">${t('rivNote')}</p></div><div class="tablebox"><h3>${t('hillKing')}</h3>${chips}${ht}</div>`;
  document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{HS.per=b.dataset.h;drawAllTime()});
  document.querySelectorAll('[data-hr]').forEach(b=>b.onclick=()=>{HS.r=+b.dataset.hr;drawAllTime()});
}
function tourPerf(tid,ms){
  const x=TO[tid]; const mIdx=D.months.indexOf(x.date.slice(0,7))-1;
  const rb=id=>{const v=mIdx>=0?histIdx(id,mIdx):null;return v??PL[id].r};
  const P={};
  ms.forEach(m=>{[[m[2],m[3],m[4],m[5],m[7],m[8]],[m[3],m[2],m[5],m[4],m[8],m[7]]].forEach(([a,b,w,l,dw,dl])=>{(P[a]=P[a]||{id:a,games:[],w:0,l:0,dw:0,dl:0,mw:0,mn:0});P[a].games.push([rb(b),w+l]);P[a].w+=w;P[a].l+=l;P[a].dw+=dw;P[a].dl+=dl;P[a].mn++;if(w>l)P[a].mw++})});
  const rows=Object.values(P).map(p=>{let perf=null;
    if(p.w>0&&p.l>0){let lo=0,hi=1400;for(let k=0;k<40;k++){const mid=(lo+hi)/2;const e=p.games.reduce((s,[ro,n])=>s+n/(1+Math.pow(2,(ro-mid)/100)),0);if(e<p.w)lo=mid;else hi=mid}perf=Math.round((lo+hi)/2)}
    return {...p,before:rb(p.id),perf}}).filter(p=>PL[p.id].lv).sort((a,b)=>(b.perf??-1)-(a.perf??-1)||b.w/(b.w+b.l)-a.w/(a.w+a.l));
  return `<h2 style="margin-top:22px">${t('tPerfTitle')}</h2>
  <div class="tablebox" style="margin-top:10px"><table class="tperf"><thead><tr><th>${t('thPlayer')}</th><th class="num">${t('thPerfFull')}</th><th class="num">+/−</th><th class="num">${t('thBefore')}</th><th class="num">${t('thMatches')}</th><th class="num hide-s">${x.game==='14.1'?t('thPoints'):t('thRacks')}</th></tr></thead><tbody>
  ${rows.map(p=>{const d=p.perf!=null?p.perf-p.before:null;return `<tr><td>${plink(p.id)}</td><td class="num rt">${p.perf??'<span class="muted">–</span>'}</td>
    <td class="num ${d>0?'up':d<0?'down':''}">${d==null?'<span class="muted">–</span>':(d>0?'+':'')+d}</td><td class="num">${p.before}</td><td class="num">${p.mw}–${p.mn-p.mw}</td><td class="num hide-s">${p.dw}:${p.dl}</td></tr>`}).join('')}
  </tbody></table></div><p class="note">${t('tPerfNote')}</p>`;
}
function drawChart(id){
  const h=D.history[id]; if(!h){$('#chart').innerHTML=`<div class="empty">${t('noHistory')}</div>`;return}
  const pts=[]; for(let i=1;i<h.length;i++) if(h[i]) pts.push([h[0]+i-1,h[i]]);
  if(pts.length<2){$('#chart').innerHTML=`<div class="empty">${t('noHistory')}</div>`;return}
  const W=900,H=260,L=44,R=16,T=14,B=28;
  const x0=pts[0][0], x1=Math.max(pts[pts.length-1][0],x0+6);
  let y0=Math.min(...pts.map(p=>p[1])), y1=Math.max(...pts.map(p=>p[1]));
  y0=Math.floor((y0-15)/50)*50; y1=Math.ceil((y1+15)/50)*50;
  const X=i=>L+(i-x0)/(x1-x0)*(W-L-R), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  let grid='';
  for(let v=y0;v<=y1;v+=50) grid+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`;
  const yr0=+D.months[x0].slice(0,4), yr1=+(D.months[x1]||D.months[D.months.length-1]).slice(0,4);
  const step=Math.max(1,Math.ceil((yr1-yr0+1)/10));
  for(let y=yr0+1;y<=yr1;y+=step){const i=D.months.indexOf(y+'-01'); if(i>=x0&&i<=x1) grid+=`<line x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${H-B}" stroke="var(--line)" stroke-dasharray="2 3"/><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${y}</text>`}
  const line=pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L');
  const path='M'+line, area='M'+X(pts[0][0]).toFixed(1)+','+(H-B)+'L'+line+'L'+X(pts[pts.length-1][0]).toFixed(1)+','+(H-B)+'Z';
  const lp=pts[pts.length-1];
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('history')}">
    ${grid}<path d="${area}" fill="var(--chart)" opacity=".08"/>
    <path d="${path}" fill="none" stroke="var(--chart)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="4" fill="var(--chart)"/>
    <text x="${Math.min(X(lp[0]),W-R-4)}" y="${Y(lp[1])-10}" text-anchor="end" font-size="12" font-weight="600" fill="var(--fg)">${lp[1]}</text>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent"/>
    <g id="tip" visibility="hidden"><line id="tl" y1="${T}" y2="${H-B}" stroke="var(--chart2)"/><circle id="tc" r="4" fill="var(--chart)"/><text id="tt" font-size="12" fill="var(--fg)" font-weight="600"></text></g></svg>`;
  const svg=$('#chart svg');
  svg.onmousemove=e=>{const b=svg.getBoundingClientRect(); const xi=x0+((e.clientX-b.left)/b.width*W-L)/(W-L-R)*(x1-x0);
    const best=pts.reduce((a,p)=>Math.abs(p[0]-xi)<Math.abs(a[0]-xi)?p:a); $('#tip').setAttribute('visibility','visible');
    $('#tl').setAttribute('x1',X(best[0]));$('#tl').setAttribute('x2',X(best[0]));$('#tc').setAttribute('cx',X(best[0]));$('#tc').setAttribute('cy',Y(best[1]));
    const tt=$('#tt'); const left=X(best[0])>W/2; tt.setAttribute('x',X(best[0])+(left?-8:8)); tt.setAttribute('text-anchor',left?'end':'start'); tt.setAttribute('y',T+14); tt.textContent=D.months[best[0]]+': '+best[1]};
  svg.onmouseleave=()=>$('#tip').setAttribute('visibility','hidden');
}

/* ---------------- tournaments ---------------- */
const TS={q:'',y:'',g:''};
function tournaments(){
  const LT=Object.values(TO).filter(x=>x.lv), years=[...new Set(LT.map(x=>x.date.slice(0,4)))].sort().reverse();
  $('#app').innerHTML=`<h1>${t('tTitle')}</h1>
  <div class="controls">
    <label>${t('findTour')}<input id="tq" type="search" placeholder="${t('tourPh')}" value="${esc(TS.q)}"></label>
    <label>${t('year')}<select id="ty"><option value="">${t('allYears')}</option>${years.map(y=>`<option>${y}</option>`).join('')}</select></label>
    <label>${t('game')}<select id="tg"><option value="">${t('allGames')}</option><option>8-ball</option><option>9-ball</option><option>10-ball</option><option>14.1</option></select></label>
  </div>
  <div class="tablebox"><table><thead><tr><th>${t('thDate')}</th><th>${t('thTour')}</th><th class="hide-s">${t('place')}</th><th>${t('thGame')}</th><th class="num">${t('thMatches')}</th></tr></thead><tbody id="tl"></tbody></table></div>`;
  $('#ty').value=TS.y;$('#tg').value=TS.g;
  const draw=()=>{const q=sfold(TS.q.trim());
    const rows=LT.filter(x=>(!TS.y||x.date.startsWith(TS.y))&&(!TS.g||x.game===TS.g)&&(!q||sfold(x.name+' '+x.city+' '+x.club+' '+x.full).includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
    $('#tl').innerHTML=rows.slice(0,400).map(x=>`<tr><td class="muted">${fmtD(isoToNum(x.date))}</td><td class="tname"><a class="pname" href="#t${x.id}">${esc(x.name)}</a></td>
      <td class="hide-s muted place" title="${esc(x.full)}">${esc(x.city)}</td><td><span class="gtag">${x.game}</span></td><td class="num">${x.n}</td></tr>`).join('')||`<tr><td colspan="5" class="empty">${t('noTours')}</td></tr>`};
  $('#tq').oninput=e=>{TS.q=e.target.value;draw()};$('#ty').onchange=e=>{TS.y=e.target.value;draw()};$('#tg').onchange=e=>{TS.g=e.target.value;draw()};
  draw();
}
function tournament(tid){
  if(!TO[tid]||!TO[tid].lv){location.hash='#tournaments';return}
  const x=TO[tid]; const ms=D.matches.filter(m=>m[1]===tid);
  const ps=new Set(); ms.forEach(m=>{ps.add(m[2]);ps.add(m[3])});
  $('#app').innerHTML=`<a class="back" href="#tournaments">${t('backT')}</a>
  <h1>${esc(x.name)}</h1>
  <p class="lede">${fmtD(isoToNum(x.date))} · ${esc(x.city)}${x.club?' · '+esc(x.club):''} · ${x.game} · ${t('tMeta',ms.length,ps.size)} ·
    <a href="${esc(x.url)}" target="_blank" rel="noopener">${t('openOn',x.src==='cuescore'?'CueScore':'Tournament Service')}</a></p>
  ${tourPerf(tid,ms)}
  <h2 style="margin-top:22px">${t('tMatches')}</h2>
  <div class="tablebox" style="margin-top:10px"><table><thead><tr><th>${t('stage')}</th><th class="num">${t('playerA')}</th><th class="num">${t('thScore')}</th><th>${t('playerB')}</th></tr></thead><tbody>
  ${ms.slice().reverse().map(m=>`<tr><td class="muted">${esc(D.stages[m[6]])}</td><td class="num">${plink(m[2])} <span class="muted">${PL[m[2]].r}</span></td>
    <td class="num"><span class="${m[4]>m[5]?'w':''}">${m[7]}</span>:<span class="${m[5]>m[4]?'w':''}">${m[8]}</span></td><td>${plink(m[3])} <span class="muted">${PL[m[3]].r}</span></td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">${t('tNote')}</p>`;
}

/* ---------------- about ---------------- */
function about(){
  $('#app').innerHTML=`<div class="prose">${t('about',Object.keys(TO).length,D.matches.length,Object.values(PL).filter(p=>p.lv).length,fmtD(isoToNum(GEN)),Math.min(...Object.values(TO).map(x=>+x.date.slice(0,4))),Math.max(...Object.values(TO).map(x=>+x.date.slice(0,4))))}</div>`;
}
